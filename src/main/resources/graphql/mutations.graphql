type Mutation {
    # Species CRUD using Input Types
    createSpecies(input: CreateSpeciesInput!): Species!
    updateSpecies(id: ID!, input: UpdateSpeciesInput!): Species!
    deleteSpecies(id: ID!): Boolean!

    # Coordinate CRUD using Input Types
    addCoordinate(speciesId: ID!, input: CoordinateInput!): Coordinate!
    updateCoordinate(id: ID!, input: CoordinateInput!): Coordinate!
    deleteCoordinate(id: ID!): Boolean!
}